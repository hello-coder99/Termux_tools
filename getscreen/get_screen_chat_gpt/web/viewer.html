<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewing &middot; Mini Remote Desktop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <a href="/" class="back-link">&larr; Back</a>

    <p class="eyebrow">Viewer</p>
    <h1>Room <span id="roomCode">------</span></h1>
    <p class="subtitle">Watching this room's shared screen live.</p>

    <div class="card">
        <div class="status-row" style="margin-top:0;">
            <span class="status-dot connecting" id="statusDot"></span>
            <span id="statusText">Connecting to signaling server&hellip;</span>
        </div>
    </div>

    <div class="card">
        <div class="video-wrap" id="videoWrap">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-empty-state" id="videoEmpty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <span class="empty-title" id="emptyTitle">Waiting for the host</span>
                <span class="empty-sub" id="emptySub">You'll see their screen here as soon as they start sharing.</span>
            </div>
        </div>
        <div class="video-toolbar">
            <div class="stat-pills" id="statPills"></div>
            <button class="btn btn-secondary" id="fullscreenButton" type="button" disabled>Fullscreen</button>
        </div>
    </div>

</div>

<script type="module" src="js/viewer.js"></script>
</body>
</html>
