<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Remote Desktop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <div class="top-bar">
        <a href="/" class="brand">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="13" rx="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
            </span>
            Mini Remote Desktop
        </a>
    </div>

    <p class="eyebrow">Peer-to-peer &middot; No install</p>
    <h1>Share a screen in seconds</h1>
    <p class="subtitle">Runs entirely browser-to-browser over WebRTC. Pick a role below to get started.</p>

    <div class="choice-grid">

        <button class="choice-card" id="hostCard" type="button">
            <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="13" rx="2"></rect>
                    <path d="M12 15l4-4-4-4M8 11h8"></path>
                </svg>
            </span>
            <h3>Start sharing</h3>
            <p>Generate a room code and broadcast your screen to anyone who joins it.</p>
        </button>

        <button class="choice-card" id="viewerCard" type="button">
            <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </span>
            <h3>Join a session</h3>
            <p>Enter a room code someone shared with you to watch their screen.</p>
        </button>

    </div>

    <div class="card" id="joinPanel" hidden>
        <p class="card-title">Join a session</p>
        <div class="field">
            <label for="room">Room code</label>
            <input id="room" type="text" class="uppercase-input" placeholder="e.g. K7P4QX" maxlength="32" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <p class="helper-text">You can paste a full share link here too.</p>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" id="joinButton" type="button">Join session</button>
            <button class="btn btn-secondary" id="cancelJoin" type="button">Cancel</button>
        </div>
    </div>

</div>

<script type="module" src="js/index.js"></script>
</body>
</html>
